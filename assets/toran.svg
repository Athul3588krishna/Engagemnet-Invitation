      <path d="M52,16 C64,25 76,40 68,58 C58,42 54,26 52,16 Z" fill="url(#leafLightGrad)" opacity="0.9" />
      <circle cx="50" cy="22" r="7.5" fill="url(#marigoldOrange)" />
      <circle cx="50" cy="22" r="4" fill="#FFE066" />
