<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="100%" height="100%">
  <defs>
    <radialGradient id="jasminePetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFA" />
      <stop offset="70%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#F5F0D5" />
    </radialGradient>
    <radialGradient id="centerYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEB3B" />
      <stop offset="60%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#C59B27" />
    </radialGradient>
  </defs>

  <!-- 5 Jasmine Petals -->
  <g transform="translate(30, 30)">
    <!-- Petal 1 (0 deg) -->
    <path d="M0,0 C-6,-12 -8,-24 0,-28 C8,-24 6,-12 0,0" fill="url(#jasminePetal)" stroke="#EADFB4" stroke-width="0.5" />
    <!-- Petal 2 (72 deg) -->
    <path d="M0,0 C-6,-12 -8,-24 0,-28 C8,-24 6,-12 0,0" fill="url(#jasminePetal)" stroke="#EADFB4" stroke-width="0.5" transform="rotate(72)" />
    <!-- Petal 3 (144 deg) -->
    <path d="M0,0 C-6,-12 -8,-24 0,-28 C8,-24 6,-12 0,0" fill="url(#jasminePetal)" stroke="#EADFB4" stroke-width="0.5" transform="rotate(144)" />
    <!-- Petal 4 (216 deg) -->
    <path d="M0,0 C-6,-12 -8,-24 0,-28 C8,-24 6,-12 0,0" fill="url(#jasminePetal)" stroke="#EADFB4" stroke-width="0.5" transform="rotate(216)" />
    <!-- Petal 5 (288 deg) -->
    <path d="M0,0 C-6,-12 -8,-24 0,-28 C8,-24 6,-12 0,0" fill="url(#jasminePetal)" stroke="#EADFB4" stroke-width="0.5" transform="rotate(288)" />
    
    <!-- Central Pistil -->
    <circle cx="0" cy="0" r="3.5" fill="url(#centerYellow)" />
    <circle cx="0" cy="0" r="1.5" fill="#827717" />
  </g>
</svg>
